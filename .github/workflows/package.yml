name: Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          uv build packages/core --out-dir dist --no-sources
          uv build packages/sdk --out-dir dist --no-sources
          uv build apps/modelctl --out-dir dist --no-sources

      - name: Create isolated environment
        run: uv venv .package-smoke --python 3.13

      - name: Install built wheels
        run: >-
          uv pip install
          --python .package-smoke/bin/python
          dist/modelctl_core-*.whl
          dist/modelctl_sdk-*.whl
          dist/modelctl-*.whl

      - name: Verify installed packages
        run: >-
          .package-smoke/bin/python -c
          "import modelctl_cli, modelctl_core, modelctl_sdk"

      - name: Verify installed CLI
        run: |
          .package-smoke/bin/modelctl version
          .package-smoke/bin/modelctl --help

      - name: Install launcher plugin fixture
        run: >-
          uv pip install
          --python .package-smoke/bin/python
          --no-deps
          tests/fixtures/launcher_plugin

      - name: Verify installed launcher plugin discovery
        run: |
          .package-smoke/bin/python - <<'PY'
          from modelctl_core.launcher.registry import LauncherRegistry

          registry = LauncherRegistry()
          launcher = registry.get("fixture")
          assert launcher is not None
          assert launcher.display_name == "Fixture Launcher"
          record = next(
              item for item in registry.diagnostics() if item.launcher_id == "fixture"
          )
          assert record.status == "loaded"
          assert record.source == "modelctl-test-launcher-plugin==0.1.0"
          PY
          .package-smoke/bin/modelctl launchers list | tee launcher-plugin-smoke.txt
          grep -F "Fixture Launcher" launcher-plugin-smoke.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelctl-distributions
          path: dist/*
          if-no-files-found: error
