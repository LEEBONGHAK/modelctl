name: Refresh cryptography lock

on:
  push:
    branches:
      - security/cryptography-50

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/cryptography-50

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Refresh patched cryptography dependency
        run: uv lock --upgrade-package cryptography

      - name: Require cryptography 50 or newer
        shell: python
        run: |
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          versions = [
              package["version"]
              for package in data["package"]
              if package["name"] == "cryptography"
          ]
          if len(versions) != 1:
              raise SystemExit(f"expected one cryptography package, found {versions}")
          major = int(versions[0].split(".", 1)[0])
          if major < 50:
              raise SystemExit(f"cryptography remains vulnerable: {versions[0]}")
          print(f"cryptography lock refreshed to {versions[0]}")

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already contains a patched cryptography release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build(deps): upgrade cryptography to 50.0.0"
          git push origin HEAD:security/cryptography-50
