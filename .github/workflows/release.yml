name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release_validation.py"
      - "tests/test_release_validation.py"
      - "apps/modelctl/pyproject.toml"
      - "packages/core/pyproject.toml"
      - "packages/sdk/pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, for example v0.1.0"
        required: true
        default: "v0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Resolve and validate release version and tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python scripts/release_validation.py --print-version)"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            tag="${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="v${version}"
          fi

          python scripts/release_validation.py --tag "${tag}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Require tagged commit to belong to refac
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refac
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/refac

      - name: Build distributions
        run: |
          uv build packages/core --out-dir dist --no-sources
          uv build packages/sdk --out-dir dist --no-sources
          uv build apps/modelctl --out-dir dist --no-sources

      - name: Create isolated environment
        run: uv venv .release-smoke --python 3.13

      - name: Install built wheels
        run: >-
          uv pip install
          --python .release-smoke/bin/python
          dist/modelctl_core-*.whl
          dist/modelctl_sdk-*.whl
          dist/modelctl-*.whl

      - name: Verify installed packages and CLI
        shell: bash
        run: |
          .release-smoke/bin/python -c "import modelctl_cli, modelctl_core, modelctl_sdk"
          .release-smoke/bin/modelctl version
          .release-smoke/bin/modelctl --help

      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelctl-release-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    needs: validate-and-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: modelctl-release-${{ needs.validate-and-build.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite assets." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"
