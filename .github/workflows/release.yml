name: Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-command.yml"
      - "pyproject.toml"
      - "release.toml"
      - "CHANGELOG.md"
      - "README.md"
      - "README.ko.md"
      - "SECURITY.md"
      - "docs/RELEASE_CRITERIA.md"
      - "docs/RELEASING.md"
      - "scripts/release_validation.py"
      - "tests/test_release_validation.py"
      - "tests/test_release_workflow.py"
      - "tests/test_release_command_workflow.py"
      - "apps/modelctl/pyproject.toml"
      - "packages/core/pyproject.toml"
      - "packages/sdk/pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate, for example v0.2.0"
        required: true
        default: "v0.2.0"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-command.yml"
      - "pyproject.toml"
      - "release.toml"
      - "CHANGELOG.md"
      - "README.md"
      - "README.ko.md"
      - "SECURITY.md"
      - "docs/RELEASE_CRITERIA.md"
      - "docs/RELEASING.md"
      - "scripts/release_validation.py"
      - "tests/test_release_validation.py"
      - "tests/test_release_workflow.py"
      - "tests/test_release_command_workflow.py"
      - "apps/modelctl/pyproject.toml"
      - "packages/core/pyproject.toml"
      - "packages/sdk/pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate complete release
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      status: ${{ steps.release.outputs.status }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python scripts/release_validation.py --print-version)"
          status="$(python scripts/release_validation.py --print-status)"

          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${REF_NAME}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="v${version}"
          fi

          python scripts/release_validation.py --tag "${tag}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Require manually tagged commit to belong to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Install locked workspace
        run: uv sync --all-packages --locked

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check v0.3 boundaries
        run: uv run basedpyright

      - name: Run complete test suite
        run: uv run pytest

      - name: Build distributions
        run: |
          uv build packages/core --out-dir dist --no-sources
          uv build packages/sdk --out-dir dist --no-sources
          uv build apps/modelctl --out-dir dist --no-sources

      - name: Create isolated environment
        run: uv venv .release-smoke --python 3.13

      - name: Install built wheels
        run: >-
          uv pip install
          --python .release-smoke/bin/python
          dist/modelctl_core-*.whl
          dist/modelctl_sdk-*.whl
          dist/modelctl-*.whl

      - name: Verify installed packages and CLI
        shell: bash
        run: |
          .release-smoke/bin/python - <<'PY'
          from importlib.resources import files

          import modelctl_cli
          import modelctl_core
          import modelctl_sdk

          assert files("modelctl_core").joinpath("py.typed").is_file()
          assert files("modelctl_sdk").joinpath("py.typed").is_file()
          PY
          .release-smoke/bin/modelctl version
          .release-smoke/bin/modelctl --help

      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelctl-release-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Create validated tag and GitHub Release
    needs: validate-and-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       needs.validate-and-build.outputs.status == 'ready') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       needs.validate-and-build.outputs.status == 'ready')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: modelctl-release-${{ needs.validate-and-build.outputs.version }}
          path: dist

      - name: Create tag and GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
          AUTO_CREATE_TAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          existing_tag_sha="$(
            gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null || true
          )"

          if [[ "${AUTO_CREATE_TAG}" == "true" ]]; then
            if [[ -z "${existing_tag_sha}" ]]; then
              gh api --method POST "repos/${REPOSITORY}/git/refs" \
                -f ref="refs/tags/${RELEASE_TAG}" \
                -f sha="${TARGET_SHA}" >/dev/null
              existing_tag_sha="${TARGET_SHA}"
              echo "Created ${RELEASE_TAG} at ${TARGET_SHA}."
            elif [[ "${existing_tag_sha}" != "${TARGET_SHA}" ]]; then
              echo "${RELEASE_TAG} already points to ${existing_tag_sha}; no overwrite." >&2
              exit 0
            fi
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; no overwrite."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${RELEASE_TAG}"
