name: Publish v0.2.0 recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.0-recovery.yml

concurrency:
  group: publish-v0.2.0-recovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.2.0
      TARGET_SHA: 9da3f46fc2fe817c2643437d48f42dd078f26482
      REPOSITORY: LEEBONGHAK/modelctl

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 9da3f46fc2fe817c2643437d48f42dd078f26482

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Require exact current main release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "${current_main}" != "${TARGET_SHA}" ]]; then
            echo "main moved from ${TARGET_SHA} to ${current_main}; refusing publication." >&2
            exit 1
          fi
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          python scripts/release_validation.py --tag "${RELEASE_TAG}"
          status="$(python scripts/release_validation.py --print-status)"
          if [[ "${status}" != "ready" ]]; then
            echo "Release status is ${status}, not ready." >&2
            exit 1
          fi

      - name: Install locked workspace
        run: uv sync --all-packages --locked

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run complete test suite
        run: uv run pytest

      - name: Build distributions
        run: |
          uv build packages/core --out-dir dist --no-sources
          uv build packages/sdk --out-dir dist --no-sources
          uv build apps/modelctl --out-dir dist --no-sources

      - name: Create isolated environment
        run: uv venv .release-smoke --python 3.13

      - name: Install built wheels
        run: >-
          uv pip install
          --python .release-smoke/bin/python
          dist/modelctl_core-*.whl
          dist/modelctl_sdk-*.whl
          dist/modelctl-*.whl

      - name: Verify installed packages and CLI
        shell: bash
        run: |
          .release-smoke/bin/python -c "import modelctl_cli, modelctl_core, modelctl_sdk"
          .release-smoke/bin/modelctl version
          .release-smoke/bin/modelctl --help

      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_tag_sha="$(
            gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null
          )"; then
            :
          else
            existing_tag_sha=""
          fi

          if [[ -z "${existing_tag_sha}" ]]; then
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null
            existing_tag_sha="${TARGET_SHA}"
          fi

          if [[ "${existing_tag_sha}" != "${TARGET_SHA}" ]]; then
            echo "${RELEASE_TAG} points to ${existing_tag_sha}; refusing to move it." >&2
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" --json tagName,assets)"
          tag_name="$(jq -r '.tagName' <<<"${release_json}")"
          asset_names="$(jq -r '.assets[].name' <<<"${release_json}" | sort)"
          asset_count="$(wc -l <<<"${asset_names}" | tr -d ' ')"
          wheel_count="$(grep -c '\.whl$' <<<"${asset_names}" || true)"
          sdist_count="$(grep -c '\.tar\.gz$' <<<"${asset_names}" || true)"

          [[ "${tag_name}" == "${RELEASE_TAG}" ]]
          [[ "${asset_count}" == "7" ]]
          [[ "${wheel_count}" == "3" ]]
          [[ "${sdist_count}" == "3" ]]
          grep -qx 'SHA256SUMS' <<<"${asset_names}"

          printf '%s\n' "${asset_names}"
