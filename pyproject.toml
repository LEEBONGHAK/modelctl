[project]
name = "modelctl-workspace"
version = "0.2.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.12",
    "basedpyright>=1.31",
    "pre-commit",
]

[tool.uv.workspace]
members = [
    "apps/modelctl",
    "packages/core",
    "packages/sdk",
]

[tool.uv.sources]
modelctl-core = { workspace = true }
modelctl-sdk = { workspace = true }

# Temporary, advisory-specific exception tracked by GitHub issue #22.
# cryptography 50.0.0 is the declared fix but is not published yet.
[tool.uv.audit]
ignore = ["GHSA-g6cj-pr64-35w5"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
