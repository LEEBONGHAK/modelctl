[project]
name = "modelctl-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.12",
    "basedpyright>=1.31",
    "pre-commit",
]

[tool.uv.workspace]
members = [
    "apps/modelctl",
    "packages/core",
    "packages/sdk",
]

[tool.uv.sources]
modelctl-core = { workspace = true }
modelctl-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
