[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[project]
name = "modelctl"

version = "0.1.0"

description = "The universal AI model and coding agent control plane"

readme = "README.md"

requires-python = ">=3.12"

license = {text = "MIT"}

authors = [
    {name = "modelctl contributors"}
]


dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "platformdirs>=4.2.0",
    "keyring>=25.0.0",
    "sqlmodel>=0.0.20",
    "httpx>=0.27.0"
]


[project.scripts]

modelctl = "modelctl.cli:app"


[tool.hatch.build.targets.wheel]

packages = [
    "src/modelctl"
]


[tool.ruff]

line-length = 100

target-version = "py312"


[tool.pytest.ini_options]

pythonpath = [
    "src"
]
