[project]
name = "modelctl-workspace"
version = "0.3.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.12",
    "basedpyright>=1.31",
    "pre-commit",
]

[tool.uv.workspace]
members = [
    "apps/modelctl",
    "packages/core",
    "packages/sdk",
]

[tool.uv.sources]
modelctl-core = { workspace = true }
modelctl-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "packages/sdk/src/modelctl_sdk/launcher.py",
    "packages/sdk/src/modelctl_sdk/__init__.py",
    "packages/core/src/modelctl_core/services/profile_service.py",
    "packages/core/src/modelctl_core/launcher/base.py",
    "packages/core/src/modelctl_core/launcher/discovery.py",
    "packages/core/src/modelctl_core/launcher/plugin_adapter.py",
    "packages/core/src/modelctl_core/launcher/registry.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
