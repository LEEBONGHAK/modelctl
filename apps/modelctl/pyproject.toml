[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"

[project]
name = "modelctl"
version = "0.1.0"
description = "Universal AI model and coding-agent control plane"
requires-python = ">=3.13"
dependencies = [
    "modelctl-core==0.1.0",
    "modelctl-sdk==0.1.0",
    "typer>=0.16",
    "rich>=14",
]

[project.scripts]
modelctl = "modelctl_cli.main:app"

[project.urls]
Repository = "https://github.com/LEEBONGHAK/modelctl"

[tool.uv.sources]
modelctl-core = { workspace = true }
modelctl-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = [
    "src/modelctl_cli"
]
