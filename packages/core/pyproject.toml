[build-system]
requires = [
    "hatchling"
]

build-backend = "hatchling.build"

[project]
name = "modelctl-core"
version = "0.1.0"
description = "Core framework for modelctl"
requires-python = ">=3.13"

dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.20",
    "platformdirs>=4",
    "keyring>=25",
    "pydantic>=2",
    "tomli-w>=1.2.0",
	"questionary>=2.0.0",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/modelctl_core"
]
