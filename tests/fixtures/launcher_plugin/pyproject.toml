[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelctl-test-launcher-plugin"
version = "0.1.0"
description = "Installed-wheel launcher plugin fixture for modelctl"
requires-python = ">=3.13"

[project.entry-points."modelctl.launchers"]
fixture = "modelctl_test_launcher:FixtureLauncher"

[tool.hatch.build.targets.wheel]
packages = ["src/modelctl_test_launcher"]
